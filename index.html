<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>LEAP単語マスター</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Spectral:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LEAP単語マスター — スタイル
   トークン: インク×紙 のテキストブック調デザイン
   ============================================================ */
:root{
  --bg:#F5F6FA;
  --surface:#FFFFFF;
  --surface-2:#EEF0F7;
  --surface-3:#E4E7F2;
  --ink:#1B2233;
  --ink-soft:#5C6478;
  --ink-faint:#8A91A6;
  --line:#E1E4EF;
  --primary:#38468C;
  --primary-dark:#28336B;
  --primary-tint:#EAEDFB;
  --accent:#D99A2B;
  --accent-tint:#FBF1DD;
  --success:#2E9E5B;
  --success-bg:#E3F6EA;
  --success-strong:#1F7A44;
  --warn:#DD7A2E;
  --warn-bg:#FDECDC;
  --danger:#D14545;
  --danger-bg:#FBE6E6;
  --superweak:#B8433A;
  --superweak-bg:#F9E3E0;
  --weak:#C98A2E;
  --weak-bg:#FBEEDB;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:24px;
  --shadow-1:0 1px 3px rgba(27,34,51,.06), 0 1px 2px rgba(27,34,51,.04);
  --shadow-2:0 6px 20px rgba(27,34,51,.08);
  --font-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
  --font-word:"Spectral","Georgia",serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button, input{font-family:inherit;}
button{cursor:pointer;}
:focus-visible{outline:3px solid #8FA0E8; outline-offset:2px;}

.app-shell{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  position:relative;
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:rgba(245,246,250,.92);
  backdrop-filter:blur(8px);
  padding:14px 18px 10px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid transparent;
}
.topbar.bordered{border-bottom-color:var(--line);}
.topbar h1{
  font-size:17px; font-weight:700; margin:0; letter-spacing:.01em;
}
.topbar .back-btn{
  border:none; background:none; padding:6px 8px 6px 0; margin-left:-6px;
  display:flex; align-items:center; gap:4px; color:var(--ink); font-weight:600; font-size:15px;
}
.icon-btn{
  border:none;background:var(--surface-2);width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
}

/* ---------- Main content ---------- */
.content{
  flex:1;
  padding:14px 18px calc(96px + var(--safe-bottom));
}
.content.no-nav-pad{padding-bottom:32px;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  max-width:560px; margin:0 auto;
  background:var(--surface);
  border-top:1px solid var(--line);
  display:flex;
  padding-bottom:var(--safe-bottom);
  box-shadow:0 -2px 12px rgba(27,34,51,.05);
}
.nav-item{
  flex:1; border:none; background:none; padding:10px 4px 8px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  color:var(--ink-faint); font-size:11px; font-weight:600;
}
.nav-item svg{width:22px;height:22px;}
.nav-item.active{color:var(--primary);}
.nav-item .dot{width:4px;height:4px;border-radius:50%;background:var(--primary);margin-top:-2px;visibility:hidden;}
.nav-item.active .dot{visibility:visible;}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);
  border-radius:var(--radius-m);
  padding:16px;
  box-shadow:var(--shadow-1);
  border:1px solid var(--line);
}
.card + .card{margin-top:12px;}
.section-title{
  font-size:13px; font-weight:700; color:var(--ink-soft);
  margin:22px 0 10px; letter-spacing:.02em;
}
.section-title:first-child{margin-top:2px;}

/* ---------- Home: hero ---------- */
.hero{
  background:linear-gradient(160deg,var(--primary) 0%,var(--primary-dark) 100%);
  color:#fff; border-radius:var(--radius-l); padding:20px; position:relative; overflow:hidden;
}
.hero::after{
  content:""; position:absolute; right:-40px; top:-40px; width:160px;height:160px;
  border-radius:50%; background:rgba(255,255,255,.06);
}
.hero-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.hero-greet{font-size:13px; opacity:.85; margin:0 0 2px;}
.hero-level{font-size:22px; font-weight:800; margin:0; font-family:var(--font-word);}
.hero-streak{
  display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.14);
  padding:6px 12px; border-radius:99px; font-size:13px; font-weight:700; white-space:nowrap;
}
.xp-bar-track{height:8px;border-radius:99px;background:rgba(255,255,255,.2);margin-top:14px;overflow:hidden;}
.xp-bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease;}
.xp-label{display:flex;justify-content:space-between;font-size:11px;opacity:.8;margin-top:6px;}

/* ---------- Stat grid ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--surface);border-radius:var(--radius-m);padding:14px;border:1px solid var(--line);}
.stat-card .num{font-family:var(--font-word);font-size:26px;font-weight:700;line-height:1.1;}
.stat-card .num small{font-size:14px;font-weight:600;color:var(--ink-faint);}
.stat-card .label{font-size:12px;color:var(--ink-soft);margin-top:4px;}
.stat-card.accent .num{color:var(--primary);}

.progress-track{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;border-radius:99px;background:var(--primary);}
.progress-fill.success{background:var(--success);}
.progress-fill.weak{background:var(--weak);}

/* ---------- Range list ---------- */
.range-item{
  display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);
}
.range-item:last-child{border-bottom:none;}
.range-badge{
  width:48px;height:48px;border-radius:var(--radius-s);background:var(--primary-tint);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;font-family:var(--font-word);
}
.range-info{flex:1; min-width:0;}
.range-info .top-row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px;}
.range-meta{font-size:11px;color:var(--ink-faint);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}
.range-go{
  border:none;background:var(--surface-2);color:var(--primary);font-weight:700;font-size:12px;
  padding:8px 12px;border-radius:99px;white-space:nowrap;
}

/* ---------- Buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:var(--radius-s);padding:14px 18px;font-weight:700;font-size:15px;width:100%;
  transition:transform .08s ease;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-secondary{background:var(--surface-2);color:var(--ink);}
.btn-ghost{background:none;color:var(--ink-soft);border:1px solid var(--line);}
.btn-danger-outline{background:none;color:var(--danger);border:1px solid var(--danger-bg);}
.btn-block-row{display:flex;gap:10px;}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btn-sm{padding:9px 14px;font-size:13px;width:auto;}

/* ---------- Form elements (setup screens) ---------- */
.field-group{margin-bottom:20px;}
.field-label{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.field-label .optional-tag{font-size:11px;font-weight:600;color:var(--ink-faint);background:var(--surface-2);padding:2px 8px;border-radius:99px;}
.seg{display:flex;background:var(--surface-2);border-radius:var(--radius-s);padding:3px;gap:3px;}
.seg button{
  flex:1;border:none;background:none;padding:10px 8px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-soft);
}
.seg button.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-1);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;}
.toggle-row .t-label{font-size:14px;font-weight:600;}
.toggle-row .t-desc{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.switch{
  position:relative;width:46px;height:27px;border-radius:99px;background:var(--surface-3);border:none;flex-shrink:0;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s ease;
}
.switch.on{background:var(--primary);}
.switch.on::after{left:22px;}
.range-inputs{display:flex;align-items:center;gap:10px;}
.num-input{
  flex:1;border:1px solid var(--line);border-radius:var(--radius-s);padding:11px 12px;font-size:15px;
  background:var(--surface);text-align:center;font-weight:700;color:var(--ink);font-family:var(--font-word);
}
.num-input:disabled{opacity:.4;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 14px;font-size:13px;font-weight:700;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px;
}
.chip.on{background:var(--primary-tint);border-color:var(--primary);color:var(--primary);}
.chip.on.weak-chip{background:var(--weak-bg);border-color:var(--weak);color:var(--weak);}
.chip.on.superweak-chip{background:var(--superweak-bg);border-color:var(--superweak);color:var(--superweak);}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center;}
.stepper button{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;color:var(--primary);
  display:flex;align-items:center;justify-content:center;
}
.stepper .val{font-size:22px;font-weight:800;min-width:56px;text-align:center;font-family:var(--font-word);}
.hint-text{font-size:12px;color:var(--ink-faint);margin-top:6px;line-height:1.5;}
.pool-banner{
  margin-top:4px;background:var(--primary-tint);color:var(--primary-dark);border-radius:var(--radius-s);
  padding:10px 12px;font-size:13px;font-weight:700;text-align:center;
}
.pool-banner.zero{background:var(--danger-bg);color:var(--danger);}

/* ---------- Quiz / Spell play screen ---------- */
.study-header{display:flex;align-items:center;gap:10px;padding:6px 0 14px;}
.study-progress-track{flex:1;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
.study-progress-fill{height:100%;background:var(--primary);border-radius:99px;transition:width .25s ease;}
.study-progress-text{font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap;font-family:var(--font-word);}
.study-quit{border:none;background:none;color:var(--ink-faint);font-size:12px;font-weight:700;padding:4px 6px;}

.question-card{
  background:var(--surface);border-radius:var(--radius-l);padding:34px 20px;min-height:150px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  border:1px solid var(--line);position:relative;transition:background-color .15s ease;gap:10px;
}
.question-card.flash-correct{background:var(--success-bg);}
.question-card.flash-wrong{background:var(--warn-bg);}
.q-badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;}
.badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;}
.badge.weak{background:var(--weak-bg);color:var(--weak);}
.badge.superweak{background:var(--superweak-bg);color:var(--superweak);}
.q-eyebrow{font-size:12px;color:var(--ink-faint);font-weight:700;}
.q-word{font-family:var(--font-word);font-size:34px;font-weight:600;color:var(--ink);word-break:break-word;}
.q-word.jp{font-family:var(--font-ui);font-size:21px;font-weight:700;line-height:1.55;}
.q-feedback-word{font-family:var(--font-word);font-size:26px;font-weight:700;color:var(--ink);}

.dontknow-btn{
  margin-top:18px;width:100%;border:1.5px dashed var(--ink-faint);background:none;color:var(--ink-soft);
  padding:15px;border-radius:var(--radius-s);font-weight:700;font-size:15px;
}
.dontknow-btn:active{background:var(--surface-2);}

.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.choice-btn{
  border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius-s);
  padding:15px 16px;font-size:15px;font-weight:600;text-align:left;color:var(--ink);line-height:1.4;
}
.choice-btn.jp-choice{font-family:var(--font-ui);}
.choice-btn.en-choice{font-family:var(--font-word);font-size:17px;}
.choice-btn.correct-flash{background:var(--success-bg);border-color:var(--success);color:var(--success-strong);}
.choice-btn.wrong-flash{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);animation:shake .3s;}
.choice-btn[disabled]{pointer-events:none;}
@keyframes shake{
  0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);}
}

.spell-input-wrap{margin-top:20px;}
.spell-input{
  width:100%;border:2px solid var(--line);border-radius:var(--radius-s);padding:16px;font-size:20px;
  font-family:var(--font-word);text-align:center;letter-spacing:.02em;background:var(--surface);color:var(--ink);
}
.spell-input:focus{border-color:var(--primary);}
.spell-input.correct-flash{border-color:var(--success);background:var(--success-bg);color:var(--success-strong);}
.spell-input.wrong-flash{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);}
.spell-submit{margin-top:12px;}

/* ---------- Result screen ---------- */
.result-hero{text-align:center;padding:26px 10px 10px;}
.result-score-ring{
  width:132px;height:132px;border-radius:50%;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:conic-gradient(var(--primary) calc(var(--pct,0)*1%), var(--surface-3) 0);
}
.result-score-ring .inner{
  width:104px;height:104px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.result-score-ring .pct{font-family:var(--font-word);font-size:26px;font-weight:800;}
.result-score-ring .pct-label{font-size:11px;color:var(--ink-faint);}
.result-title{font-size:16px;font-weight:800;margin:6px 0 2px;}
.result-sub{font-size:13px;color:var(--ink-soft);}
.setting-summary{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.setting-summary .tag{background:var(--surface-2);color:var(--ink-soft);font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;}
.wrong-word-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);}
.wrong-word-row:last-child{border-bottom:none;}
.wrong-word-row .w-word{font-family:var(--font-word);font-weight:700;font-size:15px;}
.wrong-word-row .w-meaning{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.wrong-word-row .w-badge{flex-shrink:0;}

/* ---------- Word book ---------- */
.wb-search{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:10px 14px;margin-bottom:12px;
}
.wb-search input{border:none;background:none;outline:none;flex:1;font-size:14px;color:var(--ink);}
.filter-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;-webkit-overflow-scrolling:touch;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-scroll .chip{white-space:nowrap;flex-shrink:0;}
.sort-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.sort-select{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:8px 10px;font-size:12px;font-weight:700;color:var(--ink);
}
.result-count{font-size:12px;color:var(--ink-faint);}

.card-page{
  background:linear-gradient(180deg,#FFFFFF 0%, #FCFBF7 100%);
  border-radius:var(--radius-m);border:1px solid var(--line);
  padding:16px 16px 14px;margin-bottom:10px;position:relative;
  box-shadow:var(--shadow-1);
}
.card-page::before{
  content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:0 3px 3px 0; background:var(--surface-3);
}
.card-page.weak::before{background:var(--weak);}
.card-page.superweak::before{background:var(--superweak);}
.cp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.cp-no{font-family:var(--font-word);font-size:11px;color:var(--ink-faint);font-weight:700;}
.cp-word{font-family:var(--font-word);font-size:20px;font-weight:700;color:var(--ink);margin-top:2px;}
.cp-meaning{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.6;}
.cp-stats{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.cp-stat{font-size:11px;color:var(--ink-faint);background:var(--surface-2);padding:3px 9px;border-radius:99px;font-weight:700;}
.cp-badges{display:flex;gap:6px;flex-shrink:0;}

/* ---------- Word detail modal ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,24,38,.44);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-sheet{
  background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;
  padding:22px 20px calc(26px + var(--safe-bottom));max-height:86vh;overflow-y:auto;
  animation:sheet-up .22s ease;
}
@keyframes sheet-up{from{transform:translateY(24px);opacity:.4;} to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:4px;border-radius:99px;background:var(--surface-3);margin:0 auto 16px;}
.modal-word-head{display:flex;justify-content:space-between;align-items:flex-start;}
.modal-word{font-family:var(--font-word);font-size:28px;font-weight:700;}
.modal-meaning{font-size:14px;color:var(--ink-soft);margin-top:8px;line-height:1.7;}
.modal-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;}
.modal-stat{background:var(--surface-2);border-radius:var(--radius-s);padding:12px 8px;text-align:center;}
.modal-stat .n{font-family:var(--font-word);font-size:19px;font-weight:800;}
.modal-stat .l{font-size:10px;color:var(--ink-faint);margin-top:2px;}
.modal-close-area{margin-top:20px;}

/* ---------- Weak list screen ---------- */
.tab-row{display:flex;gap:8px;margin-bottom:14px;}

/* ---------- History rows ---------- */
.history-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);}
.history-row:last-child{border-bottom:none;}
.history-icon{
  width:38px;height:38px;border-radius:50%;background:var(--surface-2);color:var(--primary);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.history-main{flex:1;min-width:0;}
.history-title{font-size:13px;font-weight:700;}
.history-sub{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.history-score{font-family:var(--font-word);font-size:15px;font-weight:800;color:var(--primary);white-space:nowrap;}

/* ---------- Empty state ---------- */
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-faint);}
.empty-state .e-icon{font-size:38px;margin-bottom:10px;}
.empty-state p{font-size:13px;line-height:1.7;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:60;box-shadow:var(--shadow-2);
  animation:toast-in .2s ease;
}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

/* ---------- Confirm dialog ---------- */
.dialog-backdrop{position:fixed;inset:0;background:rgba(20,24,38,.44);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;}
.dialog-box{background:var(--surface);border-radius:var(--radius-m);padding:22px;max-width:340px;width:100%;text-align:center;}
.dialog-box h3{margin:0 0 8px;font-size:16px;}
.dialog-box p{margin:0 0 18px;font-size:13px;color:var(--ink-soft);line-height:1.6;}

/* ---------- Loading ---------- */
.loading-screen{

}

const TOTAL_WORDS = WORDS.length;
const RANGE_SIZE = 100;
const WORD_BY_NO = new Map(WORDS.map(w => [w.no, w]));

function buildRanges(){
  const ranges = [];
  for(let start = 1; start <= TOTAL_WORDS; start += RANGE_SIZE){
    const end = Math.min(start + RANGE_SIZE - 1, TOTAL_WORDS);
    ranges.push({ start, end, label: `${start}-${end}` });
  }
  return ranges;
}
const RANGES = buildRanges();

/* ---------------- 永続化 ---------------- */
const STORAGE_KEY = "leap-vocab-app-state-v1";
let saveTimer = null;
let storageAvailable = true;

function defaultState(){
  return {
    words: {},          // no -> {seen,correct,wrong,weak,streak,learned,lastSeen}
    sessions: [],        // 学習セッション履歴 (最新が先頭)
    studyDates: [],       // "YYYY-MM-DD" の配列(重複なし)
    xp: 0,
    createdAt: Date.now()
  };
}

let appState = defaultState();

function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(persistState, 600);
}

function persistState(){
  if(!storageAvailable) return;

  try{
    const payload = JSON.stringify(appState);
    localStorage.setItem(STORAGE_KEY, payload);
  }catch(e){
    console.error("保存エラー:", e);
  }
}

function loadState(){
  try{
    const value = localStorage.getItem(STORAGE_KEY);

    if(value){
      const parsed = JSON.parse(value);

      appState = Object.assign(defaultState(), parsed);

      if(!appState.words) appState.words = {};
      if(!appState.sessions) appState.sessions = [];
      if(!appState.studyDates) appState.studyDates = [];
    }
  }catch(e){
    console.log("初期状態で開始します", e && e.message);
  }
}

/* ---------------- 単語ごとの学習状態 ---------------- */
function getWordState(no){
  let s = appState.words[no];
  if(!s){
    s = { seen:0, correct:0, wrong:0, weak:0, streak:0, learned:false, lastSeen:null };
    appState.words[no] = s;
  }
  return s;
}
function peekWordState(no){
  return appState.words[no] || { seen:0, correct:0, wrong:0, weak:0, streak:0, learned:false, lastSeen:null };
}

function todayStr(d){
  const dt = d || new Date();
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
}

function recordAnswer(no, isCorrect){
  const s = getWordState(no);
  s.seen += 1;
  s.lastSeen = Date.now();
  if(isCorrect){
    s.correct += 1;
    s.learned = true;
    if(s.weak > 0){
      s.streak += 1;
      if(s.streak >= 3){
        s.weak -= 1;
        s.streak = 0;
      }
    }
  }else{
    s.wrong += 1;
    s.streak = 0;
    if(s.weak < 2){
      s.weak += 1;
    }
  }
  const t = todayStr();
  if(!appState.studyDates.includes(t)) appState.studyDates.push(t);
  appState.xp += isCorrect ? 10 : 2;
  scheduleSave();
}

/* ---------------- XP / レベル / 連続日数 ---------------- */
function levelInfo(xp){
  // レベルNに必要な累積XP = 100 * N*(N+1)/2 の緩やかな増加
  let level = 1;
  let need = 100;
  let floor = 0;
  while(xp >= floor + need){
    floor += need;
    level += 1;
    need = 100 + (level-1) * 40;
  }
  const cur = xp - floor;
  return { level, cur, need, pct: Math.min(100, Math.round((cur/need)*100)) };
}

function computeStreakDays(){
  if(appState.studyDates.length === 0) return 0;
  const set = new Set(appState.studyDates);
  const today = new Date();
  let cursor = new Date(today);
  // 今日学習していなければ、昨日を起点にする(今日はまだ0でも連続記録は保つ)
  if(!set.has(todayStr(cursor))){
    cursor.setDate(cursor.getDate()-1);
    if(!set.has(todayStr(cursor))) return 0;
  }
  let streak = 0;
  while(set.has(todayStr(cursor))){
    streak += 1;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

/* ---------------- 集計ヘルパー ---------------- */
function overallStats(){
  let learned = 0, weak = 0, superweak = 0, attempted = 0, totalCorrect = 0, totalAnswers = 0;
  for(const no in appState.words){
    const s = appState.words[no];
    if(s.learned) learned += 1;
    if(s.weak === 1) weak += 1;
    if(s.weak === 2) superweak += 1;
    if(s.seen > 0) attempted += 1;
    totalCorrect += s.correct;
    totalAnswers += s.seen;
  }
  return { learned, weak, superweak, attempted, totalCorrect, totalAnswers,
    accuracy: totalAnswers ? Math.round((totalCorrect/totalAnswers)*100) : 0 };
}

function todayStats(){
  const t = todayStr();
  let studiedWords = 0, correct = 0, total = 0;
  for(const sess of appState.sessions){
    if(sess.dateStr === t){
      correct += sess.correctCount;
      total += sess.totalAnswered;
    }
  }
  const wordsSeenToday = new Set();
  for(const sess of appState.sessions){
    if(sess.dateStr === t){
      sess.answeredNos.forEach(n => wordsSeenToday.add(n));
    }
  }
  studiedWords = wordsSeenToday.size;
  return { studiedWords, correct, total, accuracy: total ? Math.round((correct/total)*100) : 0 };
}

function rangeStats(start, end){
  let attempted = 0, weak = 0, superweak = 0, sessions = 0, learned=0;
  for(let no = start; no <= end; no++){
    const s = peekWordState(no);
    if(s.seen>0) attempted += 1;
    if(s.learned) learned += 1;
    if(s.weak === 1) weak += 1;
    if(s.weak === 2) superweak += 1;
  }
  for(const sess of appState.sessions){
    if(sess.rangeOverlap && sess.rangeOverlap.start === start && sess.rangeOverlap.end === end) sessions += 1;
  }
  const count = end - start + 1;
  return { count, attempted, learned, weak, superweak,
    learnedPct: Math.round((learned/count)*100), attempts: sessions };
}

/* ---------------- 出題プール構築 ---------------- */
function buildPool(settings){
  const { useRange, rangeFrom, rangeTo, useWeak, weakLevels, combineMode } = settings;
  let pool = WORDS;
  if(useRange || useWeak){
    const inRange = (w) => w.no >= rangeFrom && w.no <= rangeTo;
    const inWeak = (w) => weakLevels.includes(peekWordState(w.no).weak);
    if(useRange && useWeak){
      pool = WORDS.filter(w => combineMode === "and" ? (inRange(w) && inWeak(w)) : (inRange(w) || inWeak(w)));
    }else if(useRange){
      pool = WORDS.filter(inRange);
    }else{
      pool = WORDS.filter(inWeak);
    }
  }
  return pool;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDistractors(correctWord, mode, count){
  const pool = WORDS.filter(w => w.no !== correctWord.no);
  const picked = [];
  const used = new Set([correctWord.no]);
  const shuffled = shuffle(pool);
  for(const w of shuffled){
    if(picked.length >= count) break;
    if(used.has(w.no)) continue;
    used.add(w.no);
    picked.push(w);
  }
  return picked;
}

function currentPool(settings){
  return buildPool(settings);
}

function startSession(mode, settings){
  const pool = currentPool(settings);
  let queue = settings.order === "random" ? shuffle(pool) : pool.slice().sort((a,b)=>a.no-b.no);
  queue = queue.slice(0, settings.count);
  if(queue.length === 0){
    showToast("出題できる単語がありません。設定を見直してください。");
    return false;
  }
  session = {
    mode,
    settings: Object.assign({}, settings),
    queue,
    index: 0,
    correctCount: 0,
    wrongList: [],
    answeredNos: [],
    locked: false,
    currentChoices: null,
    startedAt: Date.now()
  };
  prepareCurrentQuestion();
  goto(mode === "quiz" ? "quiz-play" : "spell-play");
  return true;
}

function prepareCurrentQuestion(){
  if(!session) return;
  const w = session.queue[session.index];
  if(session.mode === "quiz"){
    const distractors = pickDistractors(w, session.settings.direction, 3);
    let choiceWords = shuffle([w, ...distractors]);
    session.currentChoices = choiceWords.map(cw => ({
      no: cw.no,
      display: session.settings.direction === "en2ja" ? cw.meaning : cw.word,
      isCorrect: cw.no === w.no
    }));
  }
  session.locked = false;
  session.userInput = "";
}

function finishSession(aborted){
  const s = session;
  const totalAnswered = s.answeredNos.length;
  const rec = {
    id: `${Date.now()}`,
    mode: s.mode,
    dateStr: todayStr(new Date(s.startedAt)),
    timestamp: s.startedAt,
    settingsSummary: describeSettings(s.settings, s.mode),
    totalPlanned: s.queue.length,
    totalAnswered,
    correctCount: s.correctCount,
    wrongWords: s.wrongList.map(x => x.word.no),
    answeredNos: s.answeredNos.slice(),
    aborted: !!aborted,
    rangeOverlap: s.settings.useRange ? { start: s.settings.rangeFrom, end: s.settings.rangeTo } : null
  };
  appState.sessions.unshift(rec);
  if(appState.sessions.length > 200) appState.sessions.length = 200;
  scheduleSave();
  goto(s.mode === "quiz" ? "quiz-result" : "spell-result", { lastResult: rec, lastResultDetail: s });
}

function describeSettings(settings, mode){
  const tags = [];
  if(mode === "quiz"){
    tags.push(settings.direction === "en2ja" ? "英→日" : "日→英");
  }else{
    tags.push("日→英(スペル入力)");
  }
  tags.push(settings.order === "random" ? "ランダム順" : "番号順");
  if(settings.useRange) tags.push(`範囲 ${settings.rangeFrom}-${settings.rangeTo}`);
  if(settings.useWeak) tags.push(`絞込:${settings.weakLevels.map(l=>l===1?"苦手":"超苦手").join("・")}`);
  if(settings.useRange && settings.useWeak) tags.push(settings.combineMode === "and" ? "共通部分" : "いずれか");
  tags.push(`${settings.count}問`);
  return tags;
}

/* ---------------- 回答処理: クイズ ---------------- */
function answerQuiz(choiceNo, isDontKnow){
  if(!session || session.locked) return;
  session.locked = true;
  const w = session.queue[session.index];
  const isCorrect = !isDontKnow && choiceNo === w.no;
  session.answeredNos.push(w.no);
  if(isCorrect) session.correctCount += 1;
  else session.wrongList.push({ word: w, userAnswer: choiceNo });
  recordAnswer(w.no, isCorrect);

  renderQuizFeedback(choiceNo, isDontKnow, isCorrect);

  const delay = isCorrect ? 500 : 1000;
  setTimeout(() => {
    if(session.index + 1 >= session.queue.length){
      finishSession(false);
    }else{
      session.index += 1;
      prepareCurrentQuestion();
      render();
    }
  }, delay);
}

/* ---------------- 回答処理: スペル ---------------- */
function answerSpell(userText){
  if(!session || session.locked) return;
  session.locked = true;
  const w = session.queue[session.index];
  const norm = (s) => (s||"").trim().toLowerCase();
  const isCorrect = norm(userText) === norm(w.word);
  session.answeredNos.push(w.no);
  if(isCorrect) session.correctCount += 1;
  else session.wrongList.push({ word: w, userAnswer: userText });
  recordAnswer(w.no, isCorrect);

  renderSpellFeedback(isCorrect, w);

  const delay = isCorrect ? 500 : 2000;
  setTimeout(() => {
    if(session.index + 1 >= session.queue.length){
      finishSession(false);
    }else{
      session.index += 1;
      prepareCurrentQuestion();
      render();
    }
  }, delay);
}

function abortSession(){
  if(!session) return;
  finishSession(true);
}

/* ---------------- ユーティリティ ---------------- */
function esc(str){
  return String(str == null ? "" : str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function weakLabel(level){ return level === 2 ? "超苦手" : level === 1 ? "苦手" : ""; }
function weakBadgeHTML(level){
  if(!level) return "";
  return `<span class="badge ${level===2?"superweak":"weak"}">${weakLabel(level)}</span>`;
}
function fmtDate(ts){
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

    <div class="result-sub">${r.aborted ? "途中で中断しました" : "お疲れさまでした！"}</div>
    <div class="setting-summary">${r.settingsSummary.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
  </div>

  <div class="btn-block-row" style="margin-top:18px;">
    <button class="btn btn-secondary" data-action="go-home">ホームへ</button>
    <button class="btn btn-primary" data-action="retry-session" data-mode="${mode}">もう一度</button>
  </div>

  <div class="section-title">間違えた単語 (${wrongDetails.length})</div>
  <div class="card">
    ${wrongDetails.length === 0 ? `<div class="empty-state" style="padding:24px;"><p>すべて正解でした!🎉</p></div>` :
      wrongDetails.map(w => {
        const ws = peekWordState(w.no);
        return `<div class="wrong-word-row">
          <div>
            <div class="w-word">${esc(w.word)}</div>
            <div class="w-meaning">${esc(w.meaning)}</div>
          </div>
          <div class="w-badge">${weakBadgeHTML(ws.weak)}</div>
        </div>`;
      }).join("")}
  </div>
  `;
}

/* ================= 単語帳 ================= */
const wb = {
  sort: "no",       // no | weak | accuracy | attempts | alpha
  filter: "all",     // all | learned | notlearned | weak | superweak
  query: "",
  visibleCount: 60
};
const WB_PAGE = 60;

function wbFilteredSorted(filterOverride){
  const filter = filterOverride || wb.filter;
  const q = wb.query.trim().toLowerCase();
  let list = WORDS.filter(w => {
    const s = peekWordState(w.no);
    if(filter === "learned" && !s.learned) return false;
    if(filter === "notlearned" && s.learned) return false;
    if(filter === "weak" && s.weak !== 1) return false;
    if(filter === "superweak" && s.weak !== 2) return false;
    if(q){
      const matchesNo = String(w.no) === q || String(w.no).startsWith(q);
      const matchesWord = w.word.toLowerCase().includes(q);
      const matchesMeaning = w.meaning.toLowerCase().includes(q);
      if(!matchesNo && !matchesWord && !matchesMeaning) return false;
    }
    return true;
  });
  const accOf = (w) => { const s = peekWordState(w.no); return s.seen ? s.correct/s.seen : -1; };
  const attOf = (w) => peekWordState(w.no).seen;
  switch(wb.sort){
    case "weak": list.sort((a,b) => peekWordState(b.no).weak - peekWordState(a.no).weak || a.no-b.no); break;
    case "accuracy": list.sort((a,b) => accOf(b) - accOf(a)); break;
    case "attempts": list.sort((a,b) => attOf(b) - attOf(a)); break;
    case "alpha": list.sort((a,b) => a.word.localeCompare(b.word)); break;
    default: list.sort((a,b) => a.no - b.no);
  }
  return list;
}

function renderWordbook(){
  const list = wbFilteredSorted();
  const visible = list.slice(0, wb.visibleCount);
  const filters = [
    { key:"all", label:"すべて" }, { key:"learned", label:"学習済み" },
    { key:"notlearned", label:"未学習" }, { key:"weak", label:"苦手" }, { key:"superweak", label:"超苦手" }
  ];
  return `
  <div class="wb-search">
    ${ICONS.search}
    <input type="text" id="wb-search-input" placeholder="番号・スペル・意味で検索" value="${esc(wb.query)}">
  </div>
  <div class="filter-scroll">
    ${filters.map(f => `<button class="chip ${wb.filter===f.key?"on":""}" data-action="wb-filter" data-key="${f.key}">${f.label}</button>`).join("")}
  </div>
  <div class="sort-row">
    <span class="result-count">${list.length}語がヒット</span>
    <select class="sort-select" id="wb-sort-select">
      <option value="no" ${wb.sort==="no"?"selected":""}>単語番号順</option>
      <option value="alpha" ${wb.sort==="alpha"?"selected":""}>アルファベット順</option>
      <option value="accuracy" ${wb.sort==="accuracy"?"selected":""}>正答率順</option>
      <option value="attempts" ${wb.sort==="attempts"?"selected":""}>学習回数順</option>
      <option value="weak" ${wb.sort==="weak"?"selected":""}>苦手優先</option>
    </select>
  </div>
  ${visible.length === 0 ? `<div class="empty-state"><div class="e-icon">🔍</div><p>該当する単語が見つかりません。</p></div>` :
    visible.map(w => wordCardHTML(w)).join("")}
  ${list.length > visible.length ? `<button class="btn btn-ghost" data-action="wb-more" style="margin-top:8px;">もっと見る (残り${list.length-visible.length}語)</button>` : ""}
  `;
}

function wordCardHTML(w){
  const s = peekWordState(w.no);
  const acc = s.seen ? Math.round((s.correct/s.seen)*100) : null;
  return `<div class="card-page ${s.weak===2?"superweak":s.weak===1?"weak":""}" data-action="open-word" data-no="${w.no}">
    <div class="cp-top">
      <div>
        <div class="cp-no">No.${w.no}</div>
        <div class="cp-word">${esc(w.word)}</div>
      </div>
      <div class="cp-badges">${weakBadgeHTML(s.weak)}${s.learned ? `<span class="badge" style="background:var(--success-bg);color:var(--success-strong);">習得</span>` : ""}</div>
    </div>
    <div class="cp-meaning">${esc(w.meaning)}</div>
    <div class="cp-stats">
      <span class="cp-stat">学習 ${s.seen}回</span>
      <span class="cp-stat">正答率 ${acc===null ? "-" : acc+"%"}</span>
    </div>
  </div>`;
}

/* ================= 苦手リスト画面 ================= */
let weaklistTab = "both"; // weak | superweak | both
function renderWeaklist(){
  const filterKey = weaklistTab === "weak" ? "weak" : weaklistTab === "superweak" ? "superweak" : "all";
  let list;
  if(weaklistTab === "both"){
    list = WORDS.filter(w => peekWordState(w.no).weak > 0);
    list.sort((a,b) => peekWordState(b.no).weak - peekWordState(a.no).weak || a.no-b.no);
  }else{
    list = wbFilteredSorted(filterKey).filter(w => true);
  }
  return `
  <div class="tab-row">
    <div class="seg" style="flex:1;">
      <button class="${weaklistTab==="both"?"active":""}" data-action="weaklist-tab" data-key="both">すべて (${WORDS.filter(w=>peekWordState(w.no).weak>0).length})</button>
      <button class="${weaklistTab==="weak"?"active":""}" data-action="weaklist-tab" data-key="weak">苦手</button>
      <button class="${weaklistTab==="superweak"?"active":""}" data-action="weaklist-tab" data-key="superweak">超苦手</button>
    </div>
  </div>
  ${list.length === 0 ? `<div class="empty-state"><div class="e-icon">🌱</div><p>該当する単語はまだありません。<br>クイズやスペルチェックを重ねると、ここに苦手な単語が表示されます。</p></div>` :
    `<button class="btn btn-primary" style="margin-bottom:14px;" data-action="quiz-from-weaklist" data-tab="${weaklistTab}">この単語だけでクイズを始める</button>` +
    list.map(w => wordCardHTML(w)).join("")}
  `;
}

/* ================= 単語詳細モーダル ================= */
function renderWordDetailModal(no){
  const w = WORD_BY_NO.get(no);
  if(!w) return "";
  const s = peekWordState(no);
  const acc = s.seen ? Math.round((s.correct/s.seen)*100) : null;
  return `<div class="modal-backdrop" data-action="close-modal">
    <div class="modal-sheet" data-stop="1">
      <div class="modal-handle"></div>
      <div class="modal-word-head">
        <div>
          <div class="cp-no">No.${w.no}</div>
          <div class="modal-word">${esc(w.word)}</div>
        </div>
        ${weakBadgeHTML(s.weak)}
      </div>
      <div class="modal-meaning">${esc(w.meaning)}</div>
      <div class="modal-stat-grid">
        <div class="modal-stat"><div class="n">${s.seen}</div><div class="l">出題回数</div></div>
        <div class="modal-stat"><div class="n">${acc===null?"-":acc+"%"}</div><div class="l">正答率</div></div>
        <div class="modal-stat"><div class="n">${s.correct}/${s.wrong}</div><div class="l">正解/不正解</div></div>
      </div>
      <div class="hint-text" style="text-align:center;margin-top:14px;">
        ${s.learned ? "この単語は一度以上正解したことがあります(学習済み)。" : "まだ正解したことがありません。"}
        ${s.lastSeen ? `<br>最終学習: ${fmtDate(s.lastSeen)}` : ""}
      </div>
      <div class="modal-close-area">
        <button class="btn btn-secondary" data-action="close-modal">閉じる</button>
      </div>
    </div>
  </div>`;
}

/* ================= 確認ダイアログ(中断など) ================= */
function renderConfirmDialog(cfg){
  return `<div class="dialog-backdrop">
    <div class="dialog-box">
      <h3>${esc(cfg.title)}</h3>
      <p>${esc(cfg.message)}</p>
      <div class="btn-block-row">
        <button class="btn btn-secondary" data-action="dialog-cancel">キャンセル</button>
        <button class="btn btn-primary" data-action="dialog-ok">${esc(cfg.okLabel||"OK")}</button>
      </div>
    </div>
  </div>`;
}

/* ================= フォーカス保持ヘルパー ================= */
let pendingFocus = null; // { id, selStart, selEnd }

function afterRenderHook(){
  if(nav.screen === "spell-play"){
    const input = document.getElementById("spell-input");
    if(input && !session.locked){ input.focus({preventScroll:true}); }
  }
  if(pendingFocus){
    const el = document.getElementById(pendingFocus.id);
    if(el){
      el.focus({preventScroll:true});
      try{ el.setSelectionRange(pendingFocus.selStart, pendingFocus.selEnd); }catch(e){}
    }
    pendingFocus = null;
  }
}

/* ================= イベントバインド ================= */
function bindEvents(){
  const root = document.getElementById("app");

  root.addEventListener("click", onRootClick);

  const searchInput = document.getElementById("wb-search-input");
  if(searchInput){
    searchInput.addEventListener("input", (e) => {
      wb.query = e.target.value;
      wb.visibleCount = WB_PAGE;
      pendingFocus = { id: "wb-search-input", selStart: e.target.selectionStart, selEnd: e.target.selectionEnd };
      render();
    });
  }
  const sortSelect = document.getElementById("wb-sort-select");
  if(sortSelect){
    sortSelect.addEventListener("change", (e) => {
      wb.sort = e.target.value;
      wb.visibleCount = WB_PAGE;
      render();
    });
  }
  document.querySelectorAll('input[data-field]').forEach(inp => {
    inp.addEventListener("change", onRangeInputChange);
  });
  const spellForm = document.getElementById("spell-form");
  if(spellForm){
    spellForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("spell-input");
      answerSpell(input ? input.value : "");
    });
  }
}

function onRangeInputChange(e){
  const field = e.target.dataset.field;
  const mode = nav.screen === "quiz-setup" ? "quiz" : "spell";
  const settings = mode === "quiz" ? quizSetup : spellSetup;
  let v = parseInt(e.target.value, 10);
  if(isNaN(v)) v = field === "rangeFrom" ? 1 : TOTAL_WORDS;
  v = Math.max(1, Math.min(TOTAL_WORDS, v));
  settings[field] = v;
  if(settings.rangeFrom > settings.rangeTo){
    if(field === "rangeFrom") settings.rangeTo = settings.rangeFrom;
    else settings.rangeFrom = settings.rangeTo;
  }
  render();
}

function onRootClick(e){
  const modalBackdrop = e.target.closest?.(".modal-backdrop");
  if(modalBackdrop && e.target === modalBackdrop){
    nav.wordDetailNo = null; render(); return;
  }
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;
  const mode = nav.screen.startsWith("quiz") ? "quiz" : "spell";
  const settings = mode === "quiz" ? quizSetup : spellSetup;

  switch(action){
    case "go-home": goto("home"); break;

    case "nav-tab": {
      const tab = btn.dataset.tab;
      if(tab === "quiz-setup") goto("quiz-setup");
      else if(tab === "spell-setup") goto("spell-setup");
      else goto(tab);
      break;
    }

    case "open-weaklist": goto("weaklist"); break;

    case "quick-quiz": {
      quizSetup = Object.assign(defaultSetupSettings(), {
        useRange: true, rangeFrom: Number(btn.dataset.from), rangeTo: Number(btn.dataset.to),
        count: Math.min(20, Number(btn.dataset.to)-Number(btn.dataset.from)+1)
      });
      goto("quiz-setup");
      break;
    }

    case "quiz-from-weaklist": {
      const tab = btn.dataset.tab;
      const levels = tab === "weak" ? [1] : tab === "superweak" ? [2] : [1,2];
      quizSetup = Object.assign(defaultSetupSettings(), {
        useWeak: true, weakLevels: levels,
        count: Math.min(20, WORDS.filter(w => levels.includes(peekWordState(w.no).weak)).length || 1)
      });
      goto("quiz-setup");
      break;
    }

    /* ---- 設定画面の操作 ---- */
    case "toggle-range": settings.useRange = !settings.useRange; render(); break;
    case "toggle-weak": settings.useWeak = !settings.useWeak; render(); break;
    case "toggle-weak-level": {
      const lvl = Number(btn.dataset.level);
      const i = settings.weakLevels.indexOf(lvl);
      if(i >= 0){ if(settings.weakLevels.length > 1) settings.weakLevels.splice(i,1); }
      else settings.weakLevels.push(lvl);
      render();
      break;
    }
    case "count-step": {
      const pool = currentPool(settings);
      const max = Math.max(1, pool.length);
      settings.count = Math.max(1, Math.min(max, settings.count + Number(btn.dataset.delta)));
      render();
      break;
    }
    case "start-session": startSession(btn.dataset.mode, settings); break;
    case "retry-session": {
      const s = nav.lastResultDetail;
      startSession(btn.dataset.mode, s.settings);
      break;
    }

    /* ---- プレイ中 ---- */
    case "answer-quiz": answerQuiz(Number(btn.dataset.no), false); break;
    case "dontknow": if(nav.screen === "quiz-play") answerQuiz(-1, true); break;
    case "quit-session": {
      nav.confirmDialog = {
        title: "学習を中断しますか?", message: "ここまでの結果は記録され、結果画面が表示されます。",
        okLabel: "中断する", onOk: () => abortSession()
      };
      render();
      break;
    }

    /* ---- 単語帳 / 苦手リスト ---- */
    case "wb-filter": wb.filter = btn.dataset.key; wb.visibleCount = WB_PAGE; render(); break;
    case "wb-more": wb.visibleCount += WB_PAGE; render(); break;
    case "weaklist-tab": weaklistTab = btn.dataset.key; render(); break;
    case "open-word": nav.wordDetailNo = Number(btn.dataset.no); render(); break;
    case "close-modal": nav.wordDetailNo = null; render(); break;

    /* ---- ダイアログ ---- */
    case "dialog-cancel": nav.confirmDialog = null; render(); break;
    case "dialog-ok": {
      const cfg = nav.confirmDialog;
      nav.confirmDialog = null;
      if(cfg && cfg.onOk) cfg.onOk();
      break;
    }
  }
}

/* ================= 出題形式(direction)/順序(order)/組合せ(combineMode) セグメント ================= */
document.addEventListener("click", (e) => {
  const seg = e.target.closest(".seg button");
  if(!seg) return;
  const group = seg.parentElement.dataset.group;
  if(!group) return;
  const mode = nav.screen.startsWith("quiz") ? "quiz" : "spell";
  const settings = mode === "quiz" ? quizSetup : spellSetup;
  settings[group] = seg.dataset.val;
  render();
});

/* ================= 初期化 ================= */
function init(){
  const loadingEl = document.getElementById("loading");

  try{
    storageAvailable = typeof localStorage !== "undefined";
    loadState();
  }catch(e){
    storageAvailable = false;
  }

  if(loadingEl) loadingEl.style.display = "none";
  document.getElementById("app").style.display = "block";
  goto("home");
}

init();
